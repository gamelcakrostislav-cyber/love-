name: CI

on:
  push:
    branches: ["**"]
  pull_request:

defaults:
  run:
    working-directory: control-plane

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: control
          POSTGRES_PASSWORD: control
          POSTGRES_DB: control_plane
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U control"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://control:control@localhost:5432/control_plane_test
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: test-secret
      REQUEST_SIGNING_REQUIRED: "false"
      CRYPTOPAY_API_TOKEN: test-token
      BOT_TOKEN: CHANGE_ME
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: control-plane/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff
        run: ruff check .
